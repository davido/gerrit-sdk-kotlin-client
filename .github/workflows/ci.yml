name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # This client only builds the example against the pre-built JitPack SDK
      # artifact. It never runs the SDK generator, so no Node runtime is needed.
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # This repo's own toolchain: Bazel, pinned via .bazelversion (bazelisk reads it).
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true

      # Builds the example against its pinned SDK coordinate. This depends on the
      # pinned SDK (com.github.davido:gerrit-sdk-kotlin) resolving from JitPack, which
      # builds the commit into a Maven artifact on demand, plus its okhttp/gson/
      # kotlin-stdlib transitive deps from Maven Central.
      - name: Build
        run: bazel build //...
